[project]
name = "aws-bedrock-playground"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.38",
    "anthropic[bedrock]>=0.55",
    "openai>=1.84",
    "aws-bedrock-token-generator>=0.1",
    "strands-agents[bidi]>=0.1",
    "strands-agents-tools[rss]>=0.8",
    "prompt-toolkit>=3.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.27",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "pyaudio>=0.2.14",
    "unstructured[all-docs]>=0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]
