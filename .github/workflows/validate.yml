name: Validate examples

on:
  pull_request:
    paths:
      - "**/*.py"
      - "scripts/**/*.js"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate.yml"
  push:
    paths:
      - "**/*.py"
      - "scripts/**/*.js"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  local-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PortAudio development headers
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Install Python and dependencies
        run: uv sync --group dev
      - name: Run no-AWS validation
        run: uv run python scripts/check_examples.py
